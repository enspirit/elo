name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    # A Ruby version is a runtime, and Elo's promise is that the same program
    # means the same thing on every runtime. Kernel#Float("1.") raises on 3.2
    # and answers 1.0 on 3.4, which is how a fixture went green here and red on
    # CI (see .claude/tasks/done/0239); the two versions in the matrix are the
    # two sides of that change. fail-fast is off so a failure reports *which*
    # version disagreed rather than cancelling the other.
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ['3.2', '3.4']

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: elo
          POSTGRES_PASSWORD: elo
          POSTGRES_DB: elo
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        # No step pushes back to the repo, so the checkout token does not need
        # to linger in .git/config where a later step could read it.
        persist-credentials: false

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Set up Ruby
      # Third-party action pinned to a commit SHA (v1.338.0) rather than the
      # mutable @v1 tag, so a compromised upstream tag cannot change what runs.
      uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1
      with:
        ruby-version: ${{ matrix.ruby-version }}
        bundler-cache: false

    - name: Install Ruby dependencies
      run: gem install activesupport

    - name: Install Node.js dependencies
      run: npm install

    - name: Build project
      run: npm run build

    - name: Run all tests
      run: npm test
      env:
        PGHOST: localhost
        PGPORT: 5432
        PGUSER: elo
        PGPASSWORD: elo
        PGDATABASE: elo
