name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The build only reads the tree; it never pushes, so the checkout
          # token should not persist in .git/config for later steps to read.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # .nvmrc, not a literal: this workflow pinned 20 while CI pinned 22,
          # and the Astro 7 upgrade in 1.2.3 made the website need >=22.12.0 —
          # so Pages started failing on a version nobody had thought to change.
          # One file now says which Node the project is built with.
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Build codemirror-lang-elo
        run: cd contrib/codemirror-lang-elo && npm ci && npm run prepare

      - name: Install web dependencies
        run: cd web && npm ci

      - name: Build Astro site
        run: cd web && npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
